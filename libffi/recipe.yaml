context:
  version: "3.7.1"

recipe:
  name: libffi-split
  version: ${{ version }}

source:
  url: https://github.com/libffi/libffi/releases/download/v${{ version }}/libffi-${{ version }}.tar.gz
  sha256: d5e9a6638ddbd2513ddb54518eb67e4bbe6fa707bcc01c10f6212f0a088d819d

outputs:
  - staging:
      name: libffi-split
    requirements:
      build:
        - vs
        - m2-aux
        - m2-autoconf
        - m2-automake-wrapper
        - m2-bash
        - m2-grep
        - m2-libtool
        - m2-m4
        - m2-make
        - m2-patch

  - package:
      name: libffi-runtime
    inherit: libffi-split
    build:
      files:
        include:
          - Library/bin/*.dll
  - package:
      name: libffi-dev
    inherit: libffi-split
    build:
      files:
        include:
          - Library/include
          - Library/lib
          - Library/share
    requirements:
      run:
        - libffi-runtime
      run_exports:
        - libffi-runtime

about:
  license: MIT
  license_file: LICENSE
  summary: A Portable Foreign Function Interface Library
  homepage: https://sourceware.org/libffi/
  repository: https://github.com/libffi/libffi
