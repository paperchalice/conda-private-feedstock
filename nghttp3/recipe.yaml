context:
  version: "1.18.0"

recipe:
  name: nghttp3-split
  version: ${{ version }}

source:
  url: https://github.com/ngtcp2/nghttp3/releases/download/v${{ version }}/nghttp3-${{ version }}.tar.xz
  sha256: aad782c23d3f01bd4bb52c8bac7a553b631ef8115fd1612703df6183449fef19

outputs:
  - staging:
      name: nghttp3-split
    requirements:
      build:
        - vs
        - cmake

  - package:
      name: nghttp3-runtime
    inherit: nghttp3-split
    build:
      files:
        include:
          - Library/bin/*.dll
  - package:
      name: nghttp3-dev
    inherit: nghttp3-split
    build:
      files:
        include:
          - Library/include
          - Library/lib
          - Library/share
    requirements:
      run:
        - nghttp3-runtime
      run_exports:
        - nghttp3-runtime

about:
  license: MIT
  summary: HTTP/3 library written in C
  license_file: COPYING
  homepage: https://nghttp2.org/nghttp3/
  repository: https://github.com/ngtcp2/nghttp3
