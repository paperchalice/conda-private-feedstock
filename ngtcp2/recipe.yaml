context:
  version: "1.25.0"

recipe:
  name: ngtcp2-split
  version: ${{ version }}

source:
  url: https://github.com/ngtcp2/ngtcp2/releases/download/v${{ version }}/ngtcp2-${{ version }}.tar.xz
  sha256: 2a34d2484ba17847a5d11965704e9dd0fac4c6d8efc75ffe1ec7de66d8c6b6fb

outputs:
  - staging:
      name: ngtcp2-split
    requirements:
      build:
        - vs
        - cmake
      host:
        - openssl-dev

  - package:
      name: ngtcp2-runtime
    inherit: ngtcp2-split
    build:
      files:
        include:
          - Library/bin/*.dll
  - package:
      name: ngtcp2-dev
    inherit: ngtcp2-split
    build:
      files:
        include:
          - Library/include
          - Library/lib
          - Library/share
    requirements:
      run:
        - ngtcp2-runtime
      run_exports:
        - ngtcp2-runtime

about:
  license: MIT
  summary: ngtcp2 project is an effort to implement IETF QUIC protocol
  license_file: COPYING
  homepage: https://nghttp2.org/ngtcp2/
  repository: https://github.com/ngtcp2/ngtcp2
