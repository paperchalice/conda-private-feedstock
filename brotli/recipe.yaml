context:
  version: "1.2.1"

recipe:
  name: brotli-split
  version: ${{ version }}

source:
  url: https://github.com/google/brotli/archive/v${{ version }}.tar.gz
  sha256: 98d35d11a78dc453aebb7d10c3748f3f73ff78c8267c0dc697b8631f67bf7e8f

outputs:
  - staging:
      name: brotli-split
    requirements:
      build:
        - vs
        - cmake-no-system

  - package:
      name: brotli-runtime
    inherit: brotli-split
    build:
      files:
        include:
          - Library/bin/*.dll
  - package:
      name: brotli-dev
    inherit: brotli-split
    build:
      files:
        include:
          - Library/include
          - Library/lib
          - Library/share
    requirements:
      run:
        - brotli-runtime
      run_exports:
        - brotli-runtime
  - package:
      name: brotli-tools
    inherit: brotli-split
    build:
      files:
        include:
          - Library/bin/*.exe
    requirements:
      run:
        - brotli-runtime
  - package:
      name: brotli-full
    requirements:
      run:
        - brotli-tools
        - brotli-runtime
        - brotli-dev

