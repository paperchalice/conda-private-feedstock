context:
  version: "1.34.8"

recipe:
  name: c-ares
  version: ${{ version }}

source:
  url: https://github.com/c-ares/c-ares/releases/download/v${{ version }}/c-ares-${{ version }}.tar.gz
  sha256: c222b6d681096f9444d2c4863d2c1174019e27cacca0a4a5c114d36dd7d7bf78

outputs:
  - staging:
      name: c-ares-split
    requirements:
      build:
        - vs
        - cmake

  - package:
      name: c-ares-runtime
    inherit: c-ares-split
    build:
      files:
        - Library/bin/*.dll
  - package:
      name: c-ares-dev
    inherit: c-ares-split
    build:
      files:
        - Library/include
        - Library/lib
        - Library/share
    requirements:
      run:
        - c-ares-runtime
      run_exports:
        - c-ares-runtime
  - package:
      name: c-ares-tools
    inherit:  c-ares-split
    build:
      files:
        - Library/bin/*.exe
    requirements:
      run:
        - c-ares-runtime
  - package:
      name: c-ares-full
    requirements:
      run:
        - c-ares-dev
        - c-ares-tools

about:
  license: MIT
  license_file: LICENSE.md
  summary: This is c-ares, an asynchronous resolver library
  homepage: https://c-ares.haxx.se/
